<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurukuru Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A1D;--g1:#7DBB4A;--g2:#4E8A2B;--d1:#8A5A35;--d2:#6B4423;--river:#4FA3C7;--sky:#9FD3EA;--parch:#F5EEDC;--gold:#E8B23A;--red:#D0452F;--stone:#B8B6AC;--stone2:#8E8C82}
*{box-sizing:border-box}
body{margin:0;background:#E9E4D3;font-family:'DM Sans',sans-serif;color:var(--ink)}
a{color:var(--g2)}a:hover{color:var(--d2)}
.lbl{position:absolute;top:44px;white-space:nowrap;font:600 18px 'Pixelify Sans';color:var(--ink)}
.scr{position:absolute;top:80px;width:390px;height:844px;overflow:hidden;background:var(--sky);box-shadow:0 0 0 3px var(--ink),0 12px 0 0 rgba(31,42,29,.18);border-radius:6px}
.px{font-family:'Pixelify Sans',monospace}
.blk{border:3px solid var(--ink);border-radius:6px;background:var(--parch);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(31,42,29,.14)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;width:100%;border:3px solid var(--ink);border-radius:6px;background:var(--g1);color:var(--ink);font:700 22px 'Pixelify Sans';box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 var(--g2);cursor:pointer;transition:transform .05s,box-shadow .05s;margin-bottom:5px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 var(--g2)}
.btn.alt{background:#fff;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 #D9D3BE;font:700 18px 'DM Sans'}
.btn.alt:active{box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 #D9D3BE}
.btn.stone{background:var(--stone);box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 var(--stone2)}
.btn.stone:active{box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 var(--stone2)}
.fld{display:block;width:100%;height:48px;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;box-shadow:inset 0 4px 0 rgba(31,42,29,.1);padding:0 14px;font:500 16px 'DM Sans';color:var(--ink);outline:0}
.fld::placeholder{color:#7A7F6E}.fld:focus{border-color:var(--g2)}
.fl{font:700 12px 'DM Sans';letter-spacing:1px;text-transform:uppercase;margin:0 0 6px;display:block}
.xp{display:flex;gap:3px}.xp i{flex:1;height:14px;background:#D9D3BE;border:2px solid var(--ink);border-radius:2px}.xp i.on{background:var(--g1);box-shadow:inset 0 -4px 0 var(--g2)}
.lv{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;background:var(--gold);border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 -5px 0 #B98A1E;font:700 20px 'Pixelify Sans'}
.tgl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgl div{display:flex;align-items:center;justify-content:center;height:48px;border:3px solid var(--ink);border-radius:6px;background:#E6DFC9;font:700 17px 'Pixelify Sans';box-shadow:inset 0 -4px 0 #CFC7AB}
.tgl .on{background:var(--g1);box-shadow:inset 0 -4px 0 var(--g2)}
.map{position:absolute;inset:0}.map svg{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 22px;border-radius:6px 6px 0 0;border-bottom:0;box-shadow:0 -4px 0 var(--ink)}
.cloud{position:absolute;background:#fff;box-shadow:inset 0 -8px 0 #DCEBF3}
.cloud b{position:absolute;background:#fff;bottom:0}
.ground{position:absolute;left:0;right:0;bottom:0}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:76px;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;font:700 14px 'DM Sans';box-shadow:inset 0 -4px 0 #E6DFC9}
.opt.on{background:var(--g1);box-shadow:inset 0 -4px 0 var(--g2)}
.av{display:flex;align-items:center;justify-content:center;height:112px;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;box-shadow:inset 0 -5px 0 #E6DFC9;position:relative}
.av.on{background:var(--g1);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 var(--g2)}
.av.on:after{content:'';position:absolute;top:-9px;right:-9px;width:22px;height:22px;background:var(--gold) ;border:3px solid var(--ink);border-radius:4px}

body{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:32px;overflow:hidden}
.lbl{display:none}
#wrap{position:relative;flex:none}#stage{position:relative;width:390px;height:844px;transform-origin:top left}
#stage .scr{left:0!important;top:0!important;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(28px) scale(.99);transition:opacity .32s ease,transform .32s ease,visibility 0s .32s}
#stage .scr.act{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .32s ease,transform .32s ease,visibility 0s}
#jump{display:flex;flex-direction:column;gap:10px;width:150px}
.jb{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:3px solid var(--ink);border-radius:6px;background:var(--parch);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(31,42,29,.14);font:700 14px 'DM Sans';color:var(--ink);cursor:pointer;transition:transform .12s,background .15s;text-align:left}
.jb:hover{transform:translateY(-2px)}.jb:active{transform:translateY(3px)}.jb.on{background:var(--g1)}
@media(max-width:760px){#jump{display:none}}
.btn{cursor:pointer}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{filter:none;transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 var(--g2)}
.btn.alt:active{box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 #D9D3BE}.btn.stone:active{box-shadow:0 1px 0 var(--ink),inset 0 -5px 0 var(--stone2)}
.tgl div,.opt,.av,.blk[data-tap]{cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s}
.tgl div:hover,.opt:hover,.av:hover,.blk[data-tap]:hover{transform:translateY(-2px)}
.tgl div:active,.opt:active,.av:active,.blk[data-tap]:active{transform:translateY(1px) scale(.97)}
.fld{transition:border-color .15s,box-shadow .2s}.fld:focus{box-shadow:0 0 0 4px rgba(125,187,74,.45),inset 0 4px 0 rgba(31,42,29,.1)}.fld:disabled{opacity:.45}
a{transition:color .15s}.xp i{transition:background .25s,box-shadow .25s}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tin{animation:tin .35s cubic-bezier(.2,.9,.3,1)}@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
.enter .sheet{animation:slideUp .5s cubic-bezier(.2,.9,.3,1) both}@keyframes slideUp{from{transform:translateY(100%)}}
.drop{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.halo{animation:halo 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{50%{transform:scale(1.18);opacity:.6}}
.enter .rw{animation:cardIn .5s cubic-bezier(.2,.9,.3,1) both}@keyframes cardIn{from{opacity:0;transform:translateY(24px)}}
.pop{animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
.lvpop{animation:lvp .5s}@keyframes lvp{40%{transform:scale(1.3)}}
.err{display:none;margin:-8px 0 10px;font:700 12px 'DM Sans';background:#F7D77A;border:2px solid var(--ink);border-radius:4px;padding:3px 8px}
.loc{display:flex;align-items:center;gap:12px;height:62px;cursor:pointer}.loc small{display:block;font:700 11px 'DM Sans';letter-spacing:1px}.loc b{display:block;font:700 16px 'DM Sans';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s}.loc:hover b{text-decoration:underline}
.sq{display:block;width:20px;height:20px;flex:none;border:3px solid var(--ink);border-radius:3px}
.srow{display:flex;align-items:center;justify-content:space-between;min-height:44px}.srow b{display:block;font:700 16px 'DM Sans'}.srow small{display:block;font:500 12px 'DM Sans'}
.sw{width:56px;height:30px;border:3px solid var(--ink);border-radius:6px;background:#CFC7AB;position:relative;cursor:pointer;transition:background .2s;box-shadow:inset 0 3px 0 rgba(31,42,29,.12);flex:none}.sw:after{content:'';position:absolute;top:1px;left:1px;width:20px;height:20px;background:#fff;border:3px solid var(--ink);border-radius:3px;transition:transform .2s}.sw.on{background:var(--g1)}.sw.on:after{transform:translateX(26px)}
.pn{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s}.pn.open{max-height:170px;opacity:1}
.dts{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.dts::-webkit-scrollbar{display:none}
.dt{flex:none;width:52px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;box-shadow:inset 0 -4px 0 #E6DFC9;cursor:pointer;transition:transform .12s,background .15s}.dt small{font:700 10px 'DM Sans'}.dt b{font-size:20px;line-height:1}.dt:hover{transform:translateY(-2px)}.dt.on,.dc.on{background:var(--g1);box-shadow:inset 0 -4px 0 var(--g2)}
.dc{flex:1;height:44px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;box-shadow:inset 0 -4px 0 #E6DFC9;font:700 16px 'Pixelify Sans';cursor:pointer;transition:transform .12s,background .15s}.dc:hover{transform:translateY(-2px)}
.stb{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:6px;background:#fff;box-shadow:0 3px 0 var(--ink),inset 0 -4px 0 #D9D3BE;font:700 24px 'Pixelify Sans';cursor:pointer;transition:transform .05s,box-shadow .05s}.stb:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink),inset 0 -4px 0 #D9D3BE}
.tv{width:48px;text-align:center;font-weight:700;font-size:26px}
#p-pk{position:absolute;inset:0;visibility:hidden;opacity:0;background:rgba(31,42,29,.5);transition:opacity .25s,visibility 0s .25s}#p-pk.show{visibility:visible;opacity:1;transition:opacity .25s}
#p-pks{position:absolute;left:0;right:0;bottom:0;height:580px;border-radius:6px 6px 0 0;border-bottom:0;padding:18px;display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}#p-pk.show #p-pks{transform:none}
#p-list{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}.pr{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;font:700 15px 'DM Sans';cursor:pointer;transition:transform .12s,background .15s}.pr:hover{background:var(--g1);transform:translateY(-2px)}
.rad{fill:none;stroke:#3A7BE0;stroke-width:3;animation:rad 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes rad{from{transform:scale(.25);opacity:1}to{transform:scale(2.4);opacity:0}}
.pov{position:absolute;inset:0;z-index:20;visibility:hidden;opacity:0;background:rgba(31,42,29,.45);transition:opacity .25s,visibility 0s .25s}.pov.show{visibility:visible;opacity:1;transition:opacity .25s}
.pps{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 0 0;border-bottom:0;padding:18px;display:flex;flex-direction:column;gap:14px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}.pov.show .pps{transform:none}
.ptoast{position:absolute;right:14px;z-index:6;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--g1);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 var(--g2);pointer-events:none}
.srow b{font-size:15px!important}.srow small{font-size:12px!important}
.dts{display:flex!important;gap:4px!important;overflow:hidden!important;padding:0!important}.dt{flex:1!important;width:auto!important;min-width:0;height:52px!important}.dt small{font:700 10px 'DM Sans'!important}.dt b{font:700 16px 'DM Sans'!important;line-height:1.1}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.trow small{font:700 11px 'DM Sans';letter-spacing:1px}.tstep{display:flex;align-items:center;gap:8px}
.tdisp{min-width:104px;height:44px;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;box-shadow:inset 0 3px 0 rgba(31,42,29,.1);display:flex;align-items:center;justify-content:center;gap:2px;font:700 22px 'Pixelify Sans'}.tdisp b{font-size:22px;font-weight:700}
.qk{display:flex;gap:6px;margin-top:10px}.qk div{flex:1;height:38px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:6px;background:#FFFCF2;box-shadow:inset 0 -4px 0 #E6DFC9;font:700 12px 'DM Sans';cursor:pointer;transition:transform .12s,background .15s}.qk div:hover{transform:translateY(-2px)}.qk div.on{background:var(--g1);box-shadow:inset 0 -4px 0 var(--g2)}
.pn.open{max-height:210px!important}.dc{font:700 14px 'DM Sans'!important}.stb{font-size:20px!important}
</style></head><body>
<div class="lbl" style="left:60px">1 Login</div><div class="lbl" style="left:510px">2 Create your explorer</div><div class="lbl" style="left:960px">3 Home map</div><div class="lbl" style="left:1410px">4 Match found</div><div class="lbl" style="left:1860px">5 Trip complete</div><div class="lbl" style="left:2310px">6 Home map, street style</div><div class="lbl" style="left:2760px">7 Route, street style</div>

<div id="jump"></div><div id="wrap"><div id="stage"></div></div><section class="scr" style="left:60px" id="s1" data-screen-label="01 Login"></section>
<section class="scr" style="left:510px;background:var(--parch)" id="s2" data-screen-label="02 Explorer"></section>
<section class="scr" style="left:960px" id="s3" data-screen-label="03 Home map"></section>
<section class="scr" style="left:1410px" id="s4" data-screen-label="04 Match found"></section>
<section class="scr" style="left:1860px" id="s5" data-screen-label="05 Trip complete"></section>

<section class="scr" style="left:2310px" id="s6" data-screen-label="06 Home street map"></section>
<section class="scr" style="left:2760px" id="s7" data-screen-label="07 Route"></section>
<script>
const INK='#1F2A1D';
const coin=(s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="flex:none"><rect x="2" y="2" width="20" height="20" rx="3" fill="#E8B23A" stroke="${INK}" stroke-width="3"/><rect x="5" y="5" width="6" height="3" fill="#F6D77A"/><rect x="4" y="16" width="16" height="3" fill="#B98A1E"/><rect x="10" y="9" width="4" height="6" fill="#B98A1E"/></svg>`;
const flag=(s=24,c='#D0452F')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="flex:none"><rect x="4" y="2" width="3" height="21" fill="${INK}"/><path d="M7 3h13v9H7z" fill="${c}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><rect x="9" y="5" width="7" height="2" fill="#fff" opacity=".4"/></svg>`;
const avatar=(skin,hair,shirt,pants,s=64)=>`<svg width="${s}" height="${s*1.25}" viewBox="0 0 16 20" shape-rendering="crispEdges"><rect x="3" y="0" width="10" height="4" fill="${hair}"/><rect x="2" y="2" width="1" height="5" fill="${hair}"/><rect x="13" y="2" width="1" height="5" fill="${hair}"/><rect x="3" y="4" width="10" height="6" fill="${skin}"/><rect x="5" y="6" width="2" height="2" fill="${INK}"/><rect x="9" y="6" width="2" height="2" fill="${INK}"/><rect x="7" y="9" width="2" height="1" fill="#0003"/><rect x="2" y="10" width="12" height="6" fill="${shirt}"/><rect x="2" y="10" width="2" height="6" fill="${skin}"/><rect x="12" y="10" width="2" height="6" fill="${skin}"/><rect x="3" y="16" width="4" height="4" fill="${pants}"/><rect x="9" y="16" width="4" height="4" fill="${pants}"/><rect x="2" y="15" width="12" height="1" fill="#0002"/></svg>`;
const AV=[['#F0C49A','#4A2E1B','#4FA3C7','#3B4A6B'],['#B77B52','#1F1A14','#D0452F','#3B3B3B'],['#F6D3B0','#E8B23A','#4E8A2B','#6B4423']];
const cloud=(x,y,w,h)=>`<div class="cloud" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><b style="left:${w*.15}px;top:-${h*.6}px;width:${w*.4}px;height:${h*.6}px"></b><b style="left:${w*.5}px;top:-${h*.9}px;width:${w*.3}px;height:${h*.9}px"></b></div>`;
const xpbar=(n)=>`<div class="xp">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;

// ---------- map ----------
function mapSVG(){
 const C=30,W=390,H=870,cols=13,rows=29;let o='';
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const rc=r=>r<5?10:r<10?8:r<17?6:r<23?8:10;
 const riv=(c,r)=>c>=rc(r)&&c<rc(r)+3;
 const bank=(c,r)=>!riv(c,r)&&c>=rc(r)-1&&c<rc(r)+4;
 const road=(c,r)=>(r==14)||(c==2&&r>=3&&r<=24)||(r==21&&c>=2);
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const x=c*C,y=r*C;
  let f=(c+r)%2?'#7DBB4A':'#76B444';
  if(bank(c,r))f=(c+r)%2?'#E6D49A':'#DCC98B';
  if(riv(c,r))f=(c+r)%2?'#4FA3C7':'#58AACD';
  if(road(c,r)&&!riv(c,r))f='#8A5A35';
  o+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="${f}"/>`;
  if(riv(c,r)){ if(rnd()<.5)o+=`<rect x="${x+6+rnd()*10|0}" y="${y+6+rnd()*14|0}" width="10" height="4" fill="#9ED3E8"/>`;
   if(!riv(c-1,r))o+=`<rect x="${x}" y="${y}" width="3" height="${C}" fill="#2F7A9E" opacity=".55"/>`;}
  else if(road(c,r)){o+=`<rect x="${x+4+rnd()*14|0}" y="${y+4+rnd()*16|0}" width="5" height="5" fill="#6B4423"/><rect x="${x+8+rnd()*14|0}" y="${y+8+rnd()*12|0}" width="4" height="4" fill="#A0703F"/>`;}
  else if(bank(c,r)){ if(rnd()<.4)o+=`<rect x="${x+5+rnd()*16|0}" y="${y+5+rnd()*16|0}" width="4" height="4" fill="#C2AE72"/>`;}
  else if(rnd()<.18){const tx=x+6+rnd()*14|0,ty=y+8+rnd()*12|0;o+=`<rect x="${tx}" y="${ty}" width="3" height="6" fill="#4E8A2B"/><rect x="${tx+6}" y="${ty+3}" width="3" height="4" fill="#4E8A2B"/>`;}
 }
 // road edges
 o+=`<rect x="0" y="${14*C}" width="${W}" height="3" fill="#6B4423"/><rect x="0" y="${15*C-3}" width="${W}" height="3" fill="#6B4423"/>`;
 // bridges
 const bridge=(c0,c1,r)=>{const x=c0*C,w=(c1-c0+1)*C,y=r*C-4;let b=`<rect x="${x}" y="${y}" width="${w}" height="${C+8}" fill="#A0703F" stroke="${INK}" stroke-width="3"/>`;
  for(let i=1;i<(c1-c0+1)*2;i++)b+=`<rect x="${x+i*15-1}" y="${y+3}" width="2" height="${C+2}" fill="#6B4423"/>`;
  b+=`<rect x="${x-2}" y="${y-5}" width="${w+4}" height="6" fill="#6B4423" stroke="${INK}" stroke-width="2.5"/><rect x="${x-2}" y="${y+C+6}" width="${w+4}" height="6" fill="#6B4423" stroke="${INK}" stroke-width="2.5"/>`;
  for(let i=0;i<=(c1-c0+1);i+=1)b+=`<rect x="${x-2+i*C}" y="${y-8}" width="6" height="10" fill="#8A5A35" stroke="${INK}" stroke-width="2"/><rect x="${x-2+i*C}" y="${y+C+4}" width="6" height="10" fill="#8A5A35" stroke="${INK}" stroke-width="2"/>`;
  return b};
 o+=bridge(5,9,14)+bridge(7,11,21);
 // trees
 const tree=(c,r)=>{const x=c*C,y=r*C;return `<rect x="${x+11}" y="${y+18}" width="8" height="12" fill="#6B4423" stroke="${INK}" stroke-width="2"/><rect x="${x+1}" y="${y-4}" width="28" height="26" fill="#2F6A1C" stroke="${INK}" stroke-width="3"/><rect x="${x+1}" y="${y-4}" width="28" height="12" fill="#4E8A2B"/><rect x="${x+4}" y="${y-1}" width="8" height="4" fill="#7DBB4A"/><rect x="${x+1}" y="${y-4}" width="28" height="26" fill="none" stroke="${INK}" stroke-width="3"/>`};
 [[0,2],[4,2],[1,5],[5,5],[0,9],[5,9],[1,12],[4,11],[0,17],[1,19],[5,18],[4,22],[11,13],[12,16],[10,17],[12,7],[12,19],[11,25],[6,25],[1,26]].forEach(([c,r])=>o+=tree(c,r));
